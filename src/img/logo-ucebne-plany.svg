<svg xmlns="http://www.w3.org/2000/svg" width="560" height="160" viewBox="0 0 560 160">
  <rect width="560" height="160" fill="#faf7f1"/>
  <!-- notebook card -->
  <g>
    <rect x="18" y="22" width="116" height="116" rx="14" fill="#fffdf8" stroke="#e4dccc" stroke-width="2"/>
    <!-- ruled lines -->
    <line x1="30" y1="52" x2="122" y2="52" stroke="#dfe7f2" stroke-width="2.5"/>
    <line x1="30" y1="74" x2="122" y2="74" stroke="#dfe7f2" stroke-width="2.5"/>
    <line x1="30" y1="96" x2="122" y2="96" stroke="#dfe7f2" stroke-width="2.5"/>
    <line x1="30" y1="118" x2="122" y2="118" stroke="#dfe7f2" stroke-width="2.5"/>
    <!-- red margin -->
    <line x1="42" y1="30" x2="42" y2="130" stroke="#b3543f" stroke-width="2.5" opacity="0.55"/>
    <!-- pencil-checkmark -->
    <path d="M 56 88 L 76 108 L 116 56" fill="none" stroke="#b3543f" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- pencil tip on end of check -->
    <path d="M 116 56 L 128 40 L 124 54 Z" fill="#28241d"/>
  </g>
  <text x="160" y="82" font-family="Georgia, 'Lora', serif" font-size="44" font-weight="700" fill="#28241d">Učebné plány</text>
  <text x="162" y="116" font-family="Helvetica, 'Source Sans 3', sans-serif" font-size="19" letter-spacing="4" fill="#8f3f2e">PRE ZÁKLADNÉ ŠKOLY</text>
</svg>
