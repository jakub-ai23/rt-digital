    <line x1="-12" y1="4" x2="12" y2="4" stroke="#28241d" stroke-width="5" stroke-linecap="round"/>
    <path d="M -30 30 L 30 30" stroke="#b3543f" stroke-width="5" stroke-linecap="round"/>
  </g>
  <text x="160" y="82" font-family="Georgia, 'Lora', serif" font-size="44" font-weight="700" fill="#28241d">Učebné plány</text>
  <text x="162" y="116" font-family="Helvetica, 'Source Sans 3', sans-serif" font-size="19" letter-spacing="4" fill="#8f3f2e">V SÚLADE SO ŠVP</text>
