<svg xmlns="http://www.w3.org/2000/svg" width="560" height="160" viewBox="0 0 560 160">
  <rect width="560" height="160" fill="#faf7f1"/>
  <!-- round stamp -->
  <g transform="translate(78,80)">
    <circle r="58" fill="#fffdf8" stroke="#b3543f" stroke-width="3" stroke-dasharray="8 5"/>
    <circle r="46" fill="none" stroke="#e4dccc" stroke-width="2"/>
    <!-- pencil forming A-frame / rooftop over lines -->
